<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<!-- iPhone Safari 최적화 -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>Tetris Mobile Optimized</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100dvh; /* iOS Safari 동적 바 포함 */
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #fff;
			background: radial-gradient(circle at top, #222 0, #000 60%);
			transition: background 0.6s ease, filter 0.6s ease;
			-webkit-font-smoothing: antialiased;
		}

		/* Background color change based on score range */
		body.bg-1 {
			background: radial-gradient(circle at top, #222 0, #000 60%);
		}
		body.bg-2 {
			background: radial-gradient(circle at top, #1a237e 0, #000 60%);
		}
		body.bg-3 {
			background: radial-gradient(circle at top, #4a148c 0, #000 60%);
		}
		body.bg-4 {
			background: radial-gradient(circle at top, #b71c1c 0, #000 60%);
			filter: brightness(1.08);
		}

		.game-container {
			display: flex;
			gap: 20px;
			padding: 16px;
			background: rgba(20, 20, 20, 0.95);
			border-radius: 16px;
			box-shadow: 0 0 30px rgba(0,0,0,0.7);
			max-width: 960px;
			width: 100%;
			border: 1px solid #444;
		}

		.left-panel {
			display: flex;
			flex-direction: column;
			gap: 10px;
			align-items: center;
			flex: 1;
			position: relative; /* For combo effect */
		}

		#board {
			background: #000;
			border-radius: 6px;
			box-shadow: 0 0 12px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.8);
			width: 100%;
			max-width: 360px;
			height: auto;
			aspect-ratio: 10 / 20;
			border: 3px solid #555;
			transition: box-shadow 0.4s ease, border-color 0.4s ease, background 0.4s ease;
			touch-action: none;
		}

		.right-panel {
			display: flex;
			flex-direction: column;
			gap: 14px;
			min-width: 220px;
		}

		.info-box {
			padding: 10px 12px;
			background: linear-gradient(135deg, #262626, #1a1a1a);
			border-radius: 10px;
			font-size: 14px;
			border: 1px solid #444;
			box-shadow: 0 4px 10px rgba(0,0,0,0.6);
		}

		.info-box h2 {
			margin: 0 0 6px;
			font-size: 14px;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: #aaa;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.hud-value {
			font-size: 26px;
			font-weight: 700;
			text-align: right;
			font-family: "Courier New", monospace;
			letter-spacing: 0.08em;
			padding: 4px 0;
			text-shadow: 0 0 6px rgba(0,255,180,0.5);
			color: #00ffc6;
		}

		.hud-value.level {
			color: #ffeb3b;
			text-shadow: 0 0 6px rgba(255,235,59,0.7);
		}

		/* Custom styles for combined HUD display */
		.primary-hud {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.primary-hud .hud-line {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 2px 0;
		}
		.primary-hud .hud-line .label {
			font-size: 14px;
			font-weight: 600;
			color: #aaa;
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}
		.primary-hud .hud-line .value {
			font-size: 26px;
			font-weight: 700;
			font-family: "Courier New", monospace;
			letter-spacing: 0.08em;
			color: #00ffc6;
			text-shadow: 0 0 6px rgba(0,255,180,0.5);
		}
		.primary-hud .hud-line .level-value {
			color: #ffeb3b;
			text-shadow: 0 0 6px rgba(255,235,59,0.7);
		}
		
		.difficulty-label {
			font-size: 12px;
			font-weight: 600;
			color: #ffb300;
		}

		button {
			border: none;
			padding: 10px 18px;
			border-radius: 999px;
			background: #4caf50;
			color: white;
			cursor: pointer;
			font-size: 16px;
			font-weight: 600;
			transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease, opacity 0.1s ease;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			min-width: 120px;
			justify-content: center;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
		}
		
		#startBtn {
			width: 100%;
			max-width: 250px;
			margin-bottom: 4px;
		}

		button:hover {
			background: #43a047;
			box-shadow: 0 0 10px rgba(76, 175, 80, 0.6);
			transform: translateY(-1px);
		}

		button:active {
			transform: translateY(1px);
			box-shadow: none;
		}

		button.danger {
			background: #e53935;
		}

		button.danger:hover {
			background: #c62828;
		}

		.small {
			font-size: 12px;
			color: #aaa;
			line-height: 1.5;
		}

		#nextCanvas {
			background: #000;
			border-radius: 6px;
			box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
			width: 100%;
			max-width: 160px;
			height: auto;
			aspect-ratio: 1 / 1;
			display: block;
			border: 1px solid #555;
		}

		/* Combo effect */
		.combo-effect {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%) scale(0.8);
			font-size: 32px;
			font-weight: 800;
			color: #ffeb3b;
			text-shadow: 0 0 8px rgba(255,235,59,0.9), 0 0 16px rgba(255,255,255,0.7);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.3s ease, transform 0.3s ease;
		}

		.combo-effect.show {
			opacity: 1;
			transform: translate(-50%, -50%) scale(1.15);
		}

		/* Mobile touch controls */
		.touch-controls {
			margin-top: 4px;
			display: flex;
			flex-direction: column;
			gap: 6px;
			width: 100%;
			max-width: 420px;
			user-select: none;
		}

		.touch-row {
			display: flex;
			justify-content: center;
			gap: 8px;
		}

		.touch-btn {
			flex: 1;
			padding: 14px 0;
			font-size: 16px;
			border-radius: 12px;
			background: #424242;
			border: 1px solid #666;
			box-shadow: 0 2px 6px rgba(0,0,0,0.7);
			color: #fff;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
		}

		.touch-btn:active {
			transform: scale(0.96);
			box-shadow: none;
		}

		.touch-label {
			font-size: 11px;
			text-align: center;
			color: #888;
		}

		.ranking-list {
			margin: 0;
			padding-left: 18px;
			max-height: 80px;
			overflow-y: auto;
		}

		.ranking-list li {
			margin: 1px 0;
			font-size: 12px;
			color: #ccc;
		}

		/* Responsive adjustments */
		@media (max-width: 700px) {
			body {
				align-items: stretch;
			}

			.game-container {
				flex-direction: column;
				align-items: center;
				padding: 10px;
				height: 100dvh;
				max-height: 100dvh;
				overflow: hidden; /* 전체 스크롤 방지 */
			}

			/* 보드 크기를 세로 기준으로 제한 (약 54vh) */
			#board {
				width: min(90vw, 27vh); /* height = 2 * width → 최대 약 54vh */
				height: auto;
				aspect-ratio: 10 / 20;
				max-width: none;
			}

			.left-panel {
				gap: 6px;
				flex: 0 0 auto;
			}

			.right-panel {
				width: 100%;
				flex-direction: row;
				flex-wrap: wrap;
				justify-content: center;
				gap: 8px;
				flex: 0 0 auto;
			}

			.info-box {
				min-width: 150px;
				flex: 1 1 45%;
				padding: 8px 10px;
			}

			.primary-hud {
				flex: 1 1 100%;
				order: -1; /* 모바일에서 맨 위 HUD */
			}

			.primary-hud .hud-line .value,
			.hud-value {
				font-size: 20px;
			}

			.difficulty-label {
				font-size: 11px;
			}

			#nextCanvas {
				max-width: 110px;
			}

			.touch-controls {
				margin-top: 4px;
				gap: 4px;
			}

			.touch-btn {
				padding: 12px 0;
				font-size: 15px;
			}

			.ranking-list {
				max-height: 64px;
			}
		}

		@media (max-width: 480px) {
			.primary-hud .hud-line .value,
			.hud-value {
				font-size: 18px;
			}
			.info-box {
				padding: 6px 8px;
			}
			.touch-btn {
				padding: 12px 0;
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<div class="game-container">
		<div class="left-panel">
			<canvas id="board"></canvas>
			<div id="comboEffect" class="combo-effect"></div>

			<!-- Single button for starting/restarting the game -->
			<button id="startBtn">▶ 게임 시작</button>

			<!-- Mobile & PC click touch buttons -->
			<div class="touch-controls">
				<div class="touch-row">
					<button class="touch-btn" id="btnLeft">⬅ 왼쪽</button>
					<button class="touch-btn" id="btnRight">➡ 오른쪽</button>
				</div>
				<div class="touch-row">
					<button class="touch-btn" id="btnDown">⬇ 내리기</button>
					<button class="touch-btn" id="btnRotate">⟳ 회전</button>
					<button class="touch-btn danger" id="btnDrop">⬇⬇ 하드 드롭</button>
				</div>
				<div class="touch-label">
				
				</div>
			</div>
		</div>

		<div class="right-panel">
			<div class="info-box">
				<h2>Next</h2>
				<canvas id="nextCanvas" width="120" height="120"></canvas>
			</div>

			<!-- Consolidated Score, Level, and Difficulty -->
			<div class="info-box primary-hud">
				<div class="hud-line">
					<span class="label">Score</span>
					<span id="score" class="value">0</span>
				</div>
				<div class="hud-line">
					<span class="label">Level</span>
					<span id="level" class="value level-value">1</span>
				</div>
				<div class="small" style="text-align: right; margin-top: 4px;">
					Speed: <span id="difficulty" class="difficulty-label">Easy</span>
				</div>
			</div>

			<div class="info-box">
				<h2>Combo</h2>
				<div id="comboCount" class="hud-value">0</div>
				<div class="small">최대 콤보 : <span id="maxCombo">0</span></div>
			</div>

			<div class="info-box">
				<h2>Ranking (Top 5)</h2>
				<ol id="rankingList" class="small ranking-list"></ol>
			</div>
		</div>
	</div>

	<!-- ==== Audio Resources (Only core sound effects remain) ==== -->
	<audio id="se-move" src="move.mp3"></audio>
	<audio id="se-rotate" src="rotate.mp3"></audio>
	<audio id="se-drop" src="drop.mp3"></audio>
	<audio id="se-clear" src="clear.mp3"></audio>
	<audio id="se-gameover" src="gameover.mp3"></audio>

	<script>
		// ---- Basic Setup ----
		const COLS = 10;
		const ROWS = 20;
		const BLOCK_SIZE = 30;

		const canvas = document.getElementById("board");
		const ctx = canvas.getContext("2d");
		canvas.width = COLS * BLOCK_SIZE;
		canvas.height = ROWS * BLOCK_SIZE;

		const nextCanvas = document.getElementById("nextCanvas");
		const nextCtx = nextCanvas.getContext("2d");

		const scoreEl = document.getElementById("score");
		const levelEl = document.getElementById("level");
		const startBtn = document.getElementById("startBtn");
		const comboCountEl = document.getElementById("comboCount");
		const maxComboEl = document.getElementById("maxCombo");
		const comboEffectEl = document.getElementById("comboEffect");
		const rankingListEl = document.getElementById("rankingList");
		const difficultyEl = document.getElementById("difficulty");

		// Mobile buttons
		const btnLeft = document.getElementById("btnLeft");
		const btnRight = document.getElementById("btnRight");
		const btnDown = document.getElementById("btnDown");
		const btnRotate = document.getElementById("btnRotate");
		const btnDrop = document.getElementById("btnDrop");

		// Audio
		const seMove = document.getElementById("se-move");
		const seRotate = document.getElementById("se-rotate");
		const seDrop = document.getElementById("se-drop");
		const seClear = document.getElementById("se-clear");
		const seGameover = document.getElementById("se-gameover");

		let soundEnabled = true;

		const RANKING_KEY = "tetrisRanking_v2";
		const RANKING_MAX_SAVE = 20;
		const RANKING_MAX_SHOW = 5;
		let rankingCache = [];

		// Tetromino shapes and colors
		const SHAPES = {
			I: [[1,1,1,1]],
			J: [
				[1,0,0],
				[1,1,1]
			],
			L: [
				[0,0,1],
				[1,1,1]
			],
			O: [
				[1,1],
				[1,1]
			],
			S: [
				[0,1,1],
				[1,1,0]
			],
			T: [
				[0,1,0],
				[1,1,1]
			],
			Z: [
				[1,1,0],
				[0,1,1]
			]
		};

		const COLORS = {
			I: "#00ffff",
			J: "#0000ff",
			L: "#ff9900",
			O: "#ffff00",
			S: "#00ff00",
			T: "#8000ff",
			Z: "#ff0000"
		};

		let board;
		let currentPiece;
		let nextPiece;
		let gameOver = false;
		let score = 0;
		let level = 1;
		let combo = 0;
		let maxCombo = 0;
		let linesTotal = 0;

		let dropInterval = 800; // ms
		let lastTime = 0;
		let dropCounter = 0;
		let running = false;

		// ----- Utility: Sound -----
		function playSound(audio) {
			if (!soundEnabled || !audio) return;
			try {
				audio.currentTime = 0;
				audio.play();
			} catch (e) {}
		}

		// ----- Background color change based on score range -----
		function updateBackground() {
			const body = document.body;
			body.classList.remove("bg-1", "bg-2", "bg-3", "bg-4");
			let cls = "bg-1";
			if (score >= 2000) {
				cls = "bg-4";
			} else if (score >= 1200) {
				cls = "bg-3";
			} else if (score >= 500) {
				cls = "bg-2";
			}
			body.classList.add(cls);
		}

		// ----- Board color + difficulty display based on level -----
		function updateDifficulty() {
			let label = "";
			let color = "";
			let shadow = "";

			if (level <= 3) {
				label = "Easy";
				color = "#4caf50";
				shadow = "0 0 14px rgba(76,175,80,0.8), inset 0 0 10px rgba(0,0,0,0.8)";
			} else if (level <= 6) {
				label = "Normal";
				color = "#2196f3";
				shadow = "0 0 16px rgba(33,150,243,0.9), inset 0 0 10px rgba(0,0,0,0.8)";
			} else if (level <= 10) {
				label = "Hard";
				color = "#ff9800";
				shadow = "0 0 18px rgba(255,152,0,0.9), inset 0 0 10px rgba(0,0,0,0.8)";
			} else {
				label = "Insane";
				color = "#f44336";
				shadow = "0 0 22px rgba(244,67,54,1), inset 0 0 10px rgba(0,0,0,0.8)";
			}

			difficultyEl.textContent = label;
			canvas.style.borderColor = color;
			canvas.style.boxShadow = shadow;
		}

		// ----- Combo Effect -----
		function showComboEffect() {
			if (combo < 2) return; // 2+ combo
			comboEffectEl.textContent = combo + " COMBO!";
			comboEffectEl.classList.add("show");
			setTimeout(() => comboEffectEl.classList.remove("show"), 400);
		}

		// Core game logic
		function createBoard() {
			const matrix = [];
			for (let r = 0; r < ROWS; r++) {
				matrix.push(new Array(COLS).fill(0));
			}
			return matrix;
		}

		function makePiece(type) {
			return {
				x: Math.floor(COLS / 2) - 2,
				y: 0,
				shape: SHAPES[type].map(row => row.slice()),
				color: COLORS[type],
				type: type
			};
		}

		function randomPiece() {
			const types = Object.keys(SHAPES);
			const type = types[Math.floor(Math.random() * types.length)];
			return makePiece(type);
		}

		function rotate(matrix) {
			const N = matrix.length;
			const M = matrix[0].length;
			const result = [];
			for (let x = 0; x < M; x++) {
				const row = [];
				for (let y = N - 1; y >= 0; y--) {
					row.push(matrix[y][x]);
				}
				result.push(row);
			}
			return result;
		}

		function isValidMove(piece, offsetX, offsetY, newShape = null) {
			const shape = newShape || piece.shape;
			for (let y = 0; y < shape.length; y++) {
				for (let x = 0; x < shape[y].length; x++) {
					if (shape[y][x]) {
						const newX = piece.x + x + offsetX;
						const newY = piece.y + y + offsetY;

						if (newX < 0 || newX >= COLS || newY >= ROWS) {
							return false;
						}

						if (newY >= 0 && board[newY][newX]) {
							return false;
						}
					}
				}
			}
			return true;
		}

		function mergePiece() {
			const shape = currentPiece.shape;
			for (let y = 0; y < shape.length; y++) {
				for (let x = 0; x < shape[y].length; x++) {
					if (shape[y][x]) {
						const boardY = currentPiece.y + y;
						const boardX = currentPiece.x + x;
						if (
							boardY >= 0 && boardY < ROWS &&
							boardX >= 0 && boardX < COLS
						) {
							board[boardY][boardX] = currentPiece.color;
						}
					}
				}
			}
		}

		// Clear lines + combo handling (LEVEL UP BY TOTAL LINES)
		function clearLines() {
			let linesCleared = 0;
			for (let y = ROWS - 1; y >= 0; y--) {
				let full = true;
				for (let x = 0; x < COLS; x++) {
					if (!board[y][x]) {
						full = false;
						break;
					}
				}
				if (full) {
					board.splice(y, 1);
					board.unshift(new Array(COLS).fill(0));
					linesCleared++;
					y++;
				}
			}

			if (linesCleared > 0) {
				const points = [0, 40, 100, 300, 1200];
				score += points[linesCleared] * level;
				scoreEl.textContent = score.toLocaleString();

				// UPDATE TOTAL LINES CLEARED
				linesTotal += linesCleared;

				combo++;
				if (combo > maxCombo) maxCombo = combo;
				comboCountEl.textContent = combo;
				maxComboEl.textContent = maxCombo;

				playSound(seClear);
				showComboEffect();
				updateBackground();

				// Level up: every 3 lines
				const newLevel = Math.floor(linesTotal / 3) + 1;
				if (newLevel !== level) {
					level = newLevel;
					levelEl.textContent = level;
					dropInterval = Math.max(120, 800 - (level - 1) * 60);
					updateDifficulty();
				}
			} else {
				if (combo > 0) {
					combo = 0;
					comboCountEl.textContent = combo;
				}
			}
		}

		function moveDown(playSe = true) {
			if (!isValidMove(currentPiece, 0, 1)) {
				mergePiece();
				clearLines();

				currentPiece = {
					x: Math.floor(COLS / 2) - 2,
					y: 0,
					shape: nextPiece.shape.map(r => r.slice()),
					color: nextPiece.color,
					type: nextPiece.type
				};
				nextPiece = randomPiece();
				drawNext();

				if (!isValidMove(currentPiece, 0, 0)) {
					gameOver = true;
					onGameOver();
				}
			} else {
				currentPiece.y++;
				if (playSe) playSound(seMove);
			}
			draw();
		}

		function hardDrop() {
			if (gameOver || !running) return;
			while (isValidMove(currentPiece, 0, 1)) {
				currentPiece.y++;
			}
			mergePiece();
			clearLines();

			currentPiece = {
				x: Math.floor(COLS / 2) - 2,
				y: 0,
				shape: nextPiece.shape.map(r => r.slice()),
				color: nextPiece.color,
				type: nextPiece.type
			};
			nextPiece = randomPiece();
			drawNext();

			playSound(seDrop);

			if (!isValidMove(currentPiece, 0, 0)) {
				gameOver = true;
				onGameOver();
			}
			draw();
		}

		function moveHorizontal(dir) {
			if (!isValidMove(currentPiece, dir, 0)) return;
			currentPiece.x += dir;
			playSound(seMove);
			draw();
		}

		function rotatePiece() {
			const newShape = rotate(currentPiece.shape);
			if (isValidMove(currentPiece, 0, 0, newShape)) {
				currentPiece.shape = newShape;
				playSound(seRotate);
				draw();
			}
		}

		// Draw functions
		function drawBlock(x, y, color) {
			ctx.fillStyle = color;
			ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
			ctx.strokeStyle = "#111";
			ctx.lineWidth = 2;
			ctx.strokeRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
		}

		function draw() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);

			for (let y = 0; y < ROWS; y++) {
				for (let x = 0; x < COLS; x++) {
					const cell = board[y][x];
					if (cell) {
						drawBlock(x, y, cell);
					}
				}
			}

			const shape = currentPiece.shape;
			for (let y = 0; y < shape.length; y++) {
				for (let x = 0; x < shape[y].length; x++) {
					if (shape[y][x]) {
						const drawX = currentPiece.x + x;
						const drawY = currentPiece.y + y;
						if (drawY >= 0) {
							drawBlock(drawX, drawY, currentPiece.color);
						}
					}
				}
			}
		}

		function drawNext() {
			nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
			if (!nextPiece) return;

			const size = Math.min(nextCanvas.width, nextCanvas.height);
			const cellSize = size / 4;

			const shape = nextPiece.shape;
			const h = shape.length;
			const w = shape[0].length;

			const offsetX = (4 - w) / 2;
			const offsetY = (4 - h) / 2;

			for (let y = 0; y < h; y++) {
				for (let x = 0; x < w; x++) {
					if (shape[y][x]) {
						const px = (x + offsetX) * cellSize;
						const py = (y + offsetY) * cellSize;
						nextCtx.fillStyle = nextPiece.color;
						nextCtx.fillRect(px, py, cellSize, cellSize);
						nextCtx.strokeStyle = "#111";
						nextCtx.lineWidth = 2;
						nextCtx.strokeRect(px, py, cellSize, cellSize);
					}
				}
			}
		}

		// ---- Ranking ----
		function loadRankingData() {
			try {
				const str = localStorage.getItem(RANKING_KEY);
				if (!str) return [];
				const data = JSON.parse(str);
				if (!Array.isArray(data)) return [];
				// score NaN 방지
				return data
					.map(item => ({
						name: String(item.name ?? "Player"),
						score: Number(item.score) || 0,
						date: item.date || new Date().toISOString()
					}))
					.sort((a, b) => b.score - a.score);
			} catch (e) {
				return [];
			}
		}

		function saveRankingData(list) {
			try {
				localStorage.setItem(RANKING_KEY, JSON.stringify(list));
			} catch (e) {
				// private 모드 등에서는 실패 가능
			}
		}

		function renderRanking() {
			rankingListEl.innerHTML = "";

			if (!rankingCache || rankingCache.length === 0) {
				const li = document.createElement("li");
				li.textContent = "아직 기록이 없습니다.";
				rankingListEl.appendChild(li);
				return;
			}

			const topList = rankingCache.slice(0, RANKING_MAX_SHOW);
			topList.forEach((item, idx) => {
				const li = document.createElement("li");
				li.textContent = `${idx + 1}. ${item.name} - ${item.score.toLocaleString()}점`;
				rankingListEl.appendChild(li);
			});
		}

		function addRanking(scoreValue) {
			if (scoreValue <= 0) return;

			let name = prompt("게임 오버!\n랭킹에 점수를 저장하려면 이름을 입력하세요.", "플레이어");
			if (name === null) return; // 취소
			name = name.trim();
			if (!name) name = "Player";

			const entry = {
				name,
				score: scoreValue,
				date: new Date().toISOString()
			};

			rankingCache.push(entry);
			rankingCache.sort((a, b) => b.score - a.score);
			if (rankingCache.length > RANKING_MAX_SAVE) {
				rankingCache.splice(RANKING_MAX_SAVE);
			}
			saveRankingData(rankingCache);
		}

		function handleRankingOnGameOver() {
			addRanking(score);
			renderRanking();
		}

		function onGameOver() {
			running = false;
			playSound(seGameover);
			handleRankingOnGameOver();
			startBtn.textContent = "▶ 다시 시작";
		}

		// Main loop
		function update(time = 0) {
			if (!running || gameOver) {
				requestAnimationFrame(update);
				return;
			}

			const deltaTime = time - lastTime;
			lastTime = time;
			
			dropCounter += deltaTime;
			if (dropCounter > dropInterval) {
				moveDown(false);
				dropCounter = 0;
			}

			requestAnimationFrame(update);
		}

		// Game Start/Reset
		function resetGame() {
			board = createBoard();
			currentPiece = randomPiece();
			nextPiece = randomPiece();
			gameOver = false;
			score = 0;
			level = 1;
			combo = 0;
			maxCombo = 0;
			linesTotal = 0;
			dropInterval = 800;
			scoreEl.textContent = score;
			levelEl.textContent = level;
			comboCountEl.textContent = combo;
			maxComboEl.textContent = maxCombo;
			
			running = true; 
			lastTime = 0;
			dropCounter = 0;

			draw();
			drawNext();
			updateBackground();
			updateDifficulty();
			startBtn.textContent = "▶ 플레이 중...";

			requestAnimationFrame(update);
		}

		// Keyboard controls
		document.addEventListener("keydown", (e) => {
			// Prevent page scroll for space/arrow keys
			if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(e.key)) {
				e.preventDefault();
			}

			if (!running || gameOver) {
				return;
			}

			switch (e.key) {
				case "ArrowLeft":
					moveHorizontal(-1);
					break;
				case "ArrowRight":
					moveHorizontal(1);
					break;
				case "ArrowDown":
					moveDown();
					dropCounter = 0;
					break;
				case "ArrowUp":
					rotatePiece();
					break;
				case " ":
					hardDrop();
					break;
			}
		});

		// Button event (Start/Restart)
		startBtn.addEventListener("click", resetGame);

		// Touch/Click controls – pointerdown 사용
		function safeAction(fn) {
			return () => {
				if (!running || gameOver) return;
				fn();
			};
		}

		function bindControl(el, fn) {
			el.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				safeAction(fn)();
			});
		}

		bindControl(btnLeft, () => moveHorizontal(-1));
		bindControl(btnRight, () => moveHorizontal(1));
		bindControl(btnDown, () => { moveDown(); dropCounter = 0; });
		bindControl(btnRotate, () => rotatePiece());
		bindControl(btnDrop, () => hardDrop());

		// Initial setup
		board = createBoard();
		currentPiece = randomPiece();
		nextPiece = randomPiece();
		updateBackground();
		updateDifficulty();
		draw();
		drawNext();

		// 랭킹 캐시 초기화 & 표시
		rankingCache = loadRankingData();
		renderRanking();
	</script>
</body>
</html>
